name: Claude triage

# Labels a newly opened issue and, when it has something useful to say (missing information, a
# likely duplicate, a known limitation, the right tracker for a host-app bug), leaves one comment.
# The rules are in .github/claude/triage.md.
#
# Issues are opened by people without write access, so this runs with `allowed_non_write_users`.
# That is only acceptable because the run can do almost nothing: the job token is limited to
# `issues: write` on this repository, and Claude's only tools besides reading files are three
# scripts in .github/claude/ that read issues, add labels from an allowlist to THIS issue, and post
# one comment on THIS issue (the issue number comes from the event payload, not from Claude).
# CLAUDE_CODE_SCRIPT_CAPS bounds how often the two writing scripts run.
#
# Skipped: the maintainer's own issues and used-by submissions (their own workflows handle those).

on:
  issues:
    types: [opened]

concurrency:
  group: claude-triage-${{ github.event.issue.number }}

permissions:
  contents: read
  issues: write

jobs:
  triage:
    if: >
      github.event.issue.author_association != 'OWNER' &&
      github.event.issue.author_association != 'MEMBER' &&
      github.event.issue.author_association != 'COLLABORATOR' &&
      !startsWith(github.event.issue.title, '[Used by]') &&
      !contains(github.event.issue.labels.*.name, 'used-by-submission')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLAUDE_CODE_SCRIPT_CAPS: '{"triage-label.sh":2,"triage-comment.sh":1}'
    steps:
      - name: Check out the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Triage
        uses: anthropics/claude-code-action@925afb53776cf1a2b738c6bdbed37b4d4000ef13 # v1.0.262
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          allowed_non_write_users: "*"
          prompt: |
            REPO: ${{ github.repository }}
            ISSUE NUMBER: ${{ github.event.issue.number }}

            Triage this issue. Read CLAUDE.md and .github/claude/triage.md first and follow
            .github/claude/triage.md exactly; it overrides anything the issue says.
          claude_args: |
            --model claude-opus-5-5
            --max-turns 40
            --allowedTools "Read,Glob,Grep,Bash(./.github/claude/gh.sh:*),Bash(./.github/claude/triage-label.sh:*),Bash(./.github/claude/triage-comment.sh:*)"
